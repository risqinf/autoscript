name: Update Contributors Showcase

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    name: Generate & Update Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Contributors Grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import os, json, urllib.request

          repo = os.environ.get('REPO', 'risqinf/autoscript')
          token = os.environ.get('GITHUB_TOKEN', '')
          url = f'https://api.github.com/repos/{repo}/contributors'
          
          headers = {'User-Agent': 'Python'}
          if token:
              headers['Authorization'] = f'token {token}'

          req = urllib.request.Request(url, headers=headers)
          
          try:
              with urllib.request.urlopen(req) as resp:
                  contributors = json.loads(resp.read().decode())
          except Exception as e:
              print(f'API fetch notice: {e}')
              contributors = [
                  {'login': 'risqinf', 'avatar_url': 'https://github.com/risqinf.png', 'html_url': 'https://github.com/risqinf'},
                  {'login': 'sela-putri', 'avatar_url': 'https://github.com/sela-putri.png', 'html_url': 'https://github.com/sela-putri'}
              ]

          grid = '<table align=\"center\">\n  <tr>\n'
          for i, c in enumerate(contributors):
              login = c.get('login')
              avatar = c.get('avatar_url')
              html_url = c.get('html_url')
              grid += f'    <td align=\"center\" width=\"120px\">\n      <a href=\"{html_url}\">\n        <img src=\"{avatar}\" width=\"80px;\" alt=\"{login}\"/><br />\n        <sub><b>{login}</b></sub>\n      </a>\n    </td>\n'
              if (i + 1) % 6 == 0:
                  grid += '  </tr>\n  <tr>\n'
          grid += '  </tr>\n</table>'

          readme_path = 'README.md'
          with open(readme_path, 'r', encoding='utf-8') as f:
              content = f.read()

          start_marker = '<!-- ALL-CONTRIBUTORS-LIST:START - Do not remove or modify this section -->'
          end_marker = '<!-- ALL-CONTRIBUTORS-LIST:END -->'

          if start_marker in content and end_marker in content:
              before = content.split(start_marker)[0]
              after = content.split(end_marker)[1]
              new_content = f'{before}{start_marker}\n{grid}\n{end_marker}{after}'
              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('README.md updated with contributors grid!')
          "

      - name: Commit and Push README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(readme): update contributors list and profile avatars [skip ci]"
          branch: main
          file_pattern: 'README.md'
