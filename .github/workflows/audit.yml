name: Project Code Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shell-audit:
    name: Shell Script Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Syntax Check All Shell Scripts (bash -n)
        run: |
          echo "Auditing shell script syntax..."
          find . -type f -name "*.sh" -exec bash -n {} \;
          bash -n install.sh
          bash -n uninstall.sh
          bash -n install-api.sh
          bash -n update.sh
          echo "All shell scripts passed syntax validation successfully!"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: 'files'
        continue-on-error: true

  go-audit:
    name: Go REST API Server Audit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'files/go.mod'

      - name: Run Go Vet, Race Tests & Build Check
        run: |
          cd files
          go vet ./...
          go test -race -v ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.Version=v5.6.0" -v ./cmd/server/main.go
